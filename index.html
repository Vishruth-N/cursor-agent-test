<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A minimal, distraction-free video playlist viewer."
    />
    <title>Focus Viewer</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="shell" aria-label="Minimal video viewer">
      <section id="native-view" class="native-view" aria-label="Native playlist player">
        <video
          id="native-player"
          class="native-player"
          controls
          playsinline
          preload="metadata"
        ></video>
        <div id="empty-state" class="empty-state" hidden>
          <span>add sources</span>
        </div>
        <div id="playlist" class="playlist" aria-label="Playlist"></div>
      </section>

      <div id="source-panel" class="source-panel" hidden>
        <form id="source-import" class="source-import">
          <label for="source-input">sources</label>
          <textarea
            id="source-input"
            rows="5"
            spellcheck="false"
            placeholder="https://example.com/video.mp4"
          ></textarea>
          <div class="source-import-actions">
            <button type="submit">save</button>
            <button id="clear-sources" type="button" hidden>clear</button>
          </div>
          <p id="source-import-status" class="source-import-status" role="status">
            Paste direct MP4/WebM/HLS URLs you have the right to play.
          </p>
        </form>
      </div>

      <iframe
        id="viewer-frame"
        class="embed-frame"
        title="Video playlist"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen
        hidden
        loading="eager"
        referrerpolicy="no-referrer"
        sandbox="allow-forms allow-presentation allow-same-origin allow-scripts"
      ></iframe>

      <div id="source-fallback" class="fallback" hidden>
        <a id="fallback-open" class="fallback-link" target="_blank" rel="noreferrer">
          open
        </a>
      </div>

      <div class="control-zone" aria-hidden="true"></div>

      <nav class="controls" aria-label="Viewer controls">
        <button id="reload" type="button" aria-label="Reload source">
          reload
        </button>
        <a id="open-source" target="_blank" rel="noreferrer" aria-label="Open source">
          open
        </a>
        <button id="manage-sources" type="button" aria-label="Manage sources">
          sources
        </button>
        <button id="fullscreen" type="button" aria-label="Enter fullscreen">
          full
        </button>
      </nav>
    </main>
  </body>
</html>
