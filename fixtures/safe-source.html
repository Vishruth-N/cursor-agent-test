<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Safe Source</title>
    <style>
      :root {
        background: #000;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.2), transparent 8rem),
          linear-gradient(135deg, #020202, #121212 48%, #030303);
        display: flex;
        justify-content: center;
        overflow: hidden;
      }

      .panel {
        aspect-ratio: 16 / 9;
        background:
          radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.22), transparent 18%),
          linear-gradient(145deg, #1a1a1a, #050505);
        border-radius: 1.5rem;
        outline: 1px solid rgba(255, 255, 255, 0.12);
        outline-offset: -1px;
        box-shadow: 0 2rem 6rem rgba(255, 255, 255, 0.08);
        width: min(80vw, 68rem);
      }
    </style>
  </head>
  <body>
    <div class="panel" aria-label="Safe static test source"></div>
  </body>
</html>
